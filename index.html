<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marché Guinée - Application Social E-Commerce Sécurisée</title>
    
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCm-WVeJZKE6azk9AIWYfl7JAzCAOYHbj4",
        databaseURL: "https://guinee-d2f43-default-rtdb.firebaseio.com",
        projectId: "guinee-d2f43",
        storageBucket: "guinee-d2f43.firebasestorage.app"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      
      window.db = db;
      window.dbRef = ref;
      window.dbPush = push;
      window.dbOnValue = onValue;

      document.addEventListener("DOMContentLoaded", () => {
          chargerAnnoncesTempsReel();
      });

      window.chargerAnnoncesTempsReel = function() {
          const annoncesRef = window.dbRef(window.db, 'annonces');
          window.dbOnValue(annoncesRef, (snapshot) => {
              const data = snapshot.val();
              const feedContainer = document.getElementById("feedContainer");
              if (!feedContainer) return;
              feedContainer.innerHTML = "";
              
              if (data) {
                  Object.keys(data).forEach((key) => {
                      const annonce = data[key];
                      feedContainer.innerHTML += `
                          <div class="feed-card">
                              <div class="feed-header">
                                  <div class="avatar">${annonce.vendeur ? annonce.vendeur.charAt(0).toUpperCase() : 'U'}</div>
                                  <div class="feed-user-info">
                                     <h4>${annonce.vendeur || 'Utilisateur'}</h4>
                                     <span>Guinée</span>
                                  </div>
                              </div>
                              <div class="feed-body">
                                  <div class="feed-title">${annonce.titre}</div>
                                  <div class="feed-desc">${annonce.description}</div>
                                  <div class="feed-price">${annonce.prix} GNF</div>
                              </div>
                          </div>
                      `;
                  });
              } else {
                  feedContainer.innerHTML = '<p style="text-align:center; color: var(--text-secondary); padding: 30px;">Aucune annonce pour le moment.</p>';
              }
          });
      };

      window.publierAnnonceFirebase = function(titre, description, prix, vendeurNom) {
          const annoncesRef = window.dbRef(window.db, 'annonces');
          window.dbPush(annoncesRef, {
              titre: titre,
              description: description,
              prix: prix,
              vendeur: vendeurNom,
              date: Date.now()
          }).then(() => {
              alert("Annonce publiée avec succès !");
          }).catch((error) => {
              alert("Erreur lors de la publication : " + error.message);
          });
      };
    </script>

    <style>
        :root {
            --primary: #007AFF;
            --primary-rgb: 0, 122, 255;
            --accent: #FF9500;
            --bg-glass: rgba(255, 255, 255, 0.45);
            --bg-glass-card: rgba(255, 255, 255, 0.65);
            --border-glass: rgba(255, 255, 255, 0.8);
            --text-main: #1c1c1e;
            --text-secondary: #8e8e93;
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
        }

        body.dark-mode {
            --primary: #0A84FF;
            --primary-rgb: 10, 132, 255;
            --accent: #FF9F0A;
            --bg-glass: rgba(28, 28, 30, 0.45);
            --bg-glass-card: rgba(44, 44, 46, 0.65);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #f2f2f7;
            --text-secondary: #aeaeb2;
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f0f2f5;
            color: var(--text-main);
            padding-bottom: 90px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 122, 255, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 149, 0, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            transition: background 0.4s ease, color 0.4s ease;
        }

        header {
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-glass);
        }

        header h1 {
            font-size: 19px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 480px;
            background: var(--bg-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
            border-radius: 25px;
            box-shadow: var(--shadow-glass);
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            background: none;
            border: none;
            flex: 1;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item span {
            display: block;
            font-size: 18px;
            margin-bottom: 2px;
        }

        .container {
            padding: 20px;
            max-width: 550px;
            margin: 0 auto;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        h2 { font-size: 20px; font-weight: 700; }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(var(--primary-rgb), 0.35);
        }

        .feed-card {
            background: var(--bg-glass-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 22px;
            margin-bottom: 20px;
            padding: 18px;
            box-shadow: var(--shadow-glass);
            border: 1px solid var(--border-glass);
        }

        .feed-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .feed-user-info h4 { font-size: 15px; font-weight: 600; }
        .feed-user-info span { font-size: 12px; color: var(--text-secondary); }

        .feed-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .feed-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
        .feed-price { font-size: 16px; color: var(--primary); font-weight: 700; }

        /* Style de la modale de publication rapide */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--bg-glass-card);
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border-glass);
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border-radius: 10px;
            border: 1px solid var(--border-glass); background: rgba(255,255,255,0.2); color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <h1>Marché Guinée</h1>
        <div class="header-actions">
            <button class="btn-main" onclick="openModal()" style="padding: 6px 12px; font-size: 12px;">+ Publier</button>
        </div>
    </header>

    <div class="container">
        <div id="tab-feed" class="tab-content active">
            <div class="section-title">
                <h2>Fil d'actualité</h2>
            </div>
            <div id="feedContainer">
                <p style="text-align:center; color: var(--text-secondary); padding: 30px;">Chargement des annonces...</p>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('feed')">
            <span>🏠</span>Accueil
        </button>
        <button class="nav-item" onclick="openModal()">
            <span>➕</span>Vendre
        </button>
    </nav>

    <div id="pubModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">Publier une annonce</h3>
            <div class="form-group">
                <label>Votre Nom (Vendeur)</label>
                <input type="text" id="inputVendeur" placeholder="Ex: Ibrahima">
            </div>
            <div class="form-group">
                <label>Titre de l'article</label>
                <input type="text" id="inputTitre" placeholder="Ex: iPhone 13 Pro">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="inputDesc" placeholder="Détails de l'article..."></textarea>
            </div>
            <div class="form-group">
                <label>Prix (GNF)</label>
                <input type="text" id="inputPrix" placeholder="Ex: 5000000">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-main" onclick="validerPublication()" style="flex: 1;">Publier</button>
                <button class="btn-main" onclick="closeModal()" style="flex: 1; background: #8e8e93;">Annuler</button>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('pubModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('pubModal').style.display = 'none';
        }
        function validerPublication() {
            const vendeur = document.getElementById('inputVendeur').value.trim();
            const titre = document.getElementById('inputTitre').value.trim();
            const desc = document.getElementById('inputDesc').value.trim();
            const prix = document.getElementById('inputPrix').value.trim();

            if(!vendeur || !titre || !prix) {
                alert("Veuillez remplir au moins le nom, le titre et le prix !");
                return;
            }

            window.publierAnnonceFirebase(titre, desc, prix, vendeur);
            closeModal();

            // Vider les champs
            document.getElementById('inputTitre').value = '';
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputPrix').value = '';
        }
    </script>
</body>
</html>
