<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marché Guinée - Application Social E-Commerce Sécurisée</title>
    
    <!-- Firebase SDK Realtime Database -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCm-WVeJZKE6azk9AIWYfl7JAzCAOYHbj4",
        databaseURL: "https://guinee-d2f43-default-rtdb.firebaseio.com",
        projectId: "guinee-d2f43",
        storageBucket: "guinee-d2f43.firebasestorage.app"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      
      window.db = db;
      window.dbRef = ref;
      window.dbPush = push;
      window.dbOnValue = onValue;

      document.addEventListener("DOMContentLoaded", () => {
          chargerAnnoncesTempsReel();
      });

      function chargerAnnoncesTempsReel() {
          const annoncesRef = window.dbRef(window.db, 'annonces');
          window.dbOnValue(annoncesRef, (snapshot) => {
              const data = snapshot.val();
              const feedContainer = document.getElementById("feedContainer");
              if (!feedContainer) return;
              feedContainer.innerHTML = "";
              
              if (data) {
                  Object.keys(data).forEach((key) => {
                      const annonce = data[key];
                      feedContainer.innerHTML += `
                          <div class="feed-card" style="padding: 16px; margin-bottom: 15px;">
                              <div class="feed-header" style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">
                                  <div class="avatar" style="width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">${annonce.vendeur ? annonce.vendeur.charAt(0).toUpperCase() : 'U'}</div>
                                  <div>
                                     <h4 style="font-size: 15px; font-weight: 600;">${annonce.vendeur || 'Utilisateur'}</h4>
                                     <span style="font-size: 12px; color: var(--text-secondary);">Guinée</span>
                                  </div>
                              </div>
                              <div class="feed-body">
                                  <div class="feed-title" style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">${annonce.titre}</div>
                                  <div class="feed-desc" style="font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;">${annonce.description}</div>
                                  <div class="feed-price" style="font-size: 16px; color: var(--primary); font-weight: 700;">${annonce.prix} GNF</div>
                              </div>
                          </div>
                      `;
                  });
              } else {
                  feedContainer.innerHTML = '<p style="text-align:center; color: var(--text-secondary); padding: 30px;">Aucune annonce pour le moment.</p>';
              }
          });
      }
    </script>

    <style>
        :root {
            --primary: #007AFF;
            --primary-rgb: 0, 122, 255;
            --accent: #FF9500;
            --bg-glass: rgba(255, 255, 255, 0.45);
            --bg-glass-card: rgba(255, 255, 255, 0.65);
            --border-glass: rgba(255, 255, 255, 0.8);
            --text-main: #1c1c1e;
            --text-secondary: #8e8e93;
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
        }

        body.dark-mode {
            --primary: #0A84FF;
            --primary-rgb: 10, 132, 255;
            --accent: #FF9F0A;
            --bg-glass: rgba(28, 28, 30, 0.45);
            --bg-glass-card: rgba(44, 44, 46, 0.65);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #f2f2f7;
            --text-secondary: #aeaeb2;
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f0f2f5;
            color: var(--text-main);
            padding-bottom: 90px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 122, 255, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 149, 0, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        header {
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-glass);
        }

        header h1 {
            font-size: 19px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            padding: 20px;
            max-width: 550px;
            margin: 0 auto;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .feed-card {
            background: var(--bg-glass-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 22px;
            box-shadow: var(--shadow-glass);
            border: 1px solid var(--border-glass);
        }
    </style>
</head>
<body>

    <header>
        <h1>Marché Guinée</h1>
    </header>

    <div class="container">
        <div id="tab-feed" class="tab-content active">
            <div class="section-title">
                <h2>Fil d'actualité</h2>
            </div>
            <div id="feedContainer">
                <p style="text-align:center; color: var(--text-secondary); padding: 30px;">Chargement des annonces...</p>
            </div>
        </div>
    </div>

</body>
</html>
