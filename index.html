<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marché Guinée - Application Social E-Commerce Sécurisée</title>
    
    <!-- Firebase SDK v10 (Firestore & App) via balise script -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // Votre configuration Firebase officielle
      const firebaseConfig = {
        apiKey: "AIzaSyB16I2vKFHKQC01NEXG4mblHeMm0EN02b4",
        authDomain: "guinemarche.firebaseapp.com",
        projectId: "guinemarche",
        storageBucket: "guinemarche.firebasestorage.app",
        messagingSenderId: "135735772771",
        appId: "1:135735772771:web:5432085958e2ea08e91a56",
        measurementId: "G-8MZ7TG7L4Z"
      };

      // Initialisation de Firebase et Firestore
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      
      window.db = db;

      // Écouter et actualiser le fil d'actualité en temps réel depuis Firestore
      document.addEventListener("DOMContentLoaded", () => {
          chargerAnnoncesFirestore();
      });

      window.chargerAnnoncesFirestore = function() {
          const q = query(collection(db, "annonces"), orderBy("date", "desc"));
          onSnapshot(q, (querySnapshot) => {
              const feedContainer = document.getElementById("feedContainer");
              if (!feedContainer) return;
              feedContainer.innerHTML = "";
              
              if (!querySnapshot.empty) {
                  querySnapshot.forEach((doc) => {
                      const annonce = doc.data();
                      let avatarHtml = annonce.avatar ? 
                          `<img src="${annonce.avatar}" class="avatar-img" style="width:42px; height:42px; border-radius:50%; object-fit:cover;">` : 
                          `<div class="avatar">${annonce.vendeur ? annonce.vendeur.charAt(0).toUpperCase() : 'U'}</div>`;

                      feedContainer.innerHTML += `
                          <div class="feed-card">
                              <div class="feed-header">
                                  ${avatarHtml}
                                  <div class="feed-user-info">
                                     <h4>${annonce.vendeur || 'Utilisateur'}</h4>
                                     <span>📍 ${annonce.location || 'Guinée'}</span>
                                  </div>
                              </div>
                              <div class="feed-body">
                                  <div class="feed-title">${annonce.titre}</div>
                                  <div class="feed-desc">${annonce.description}</div>
                                  <div class="feed-price">${annonce.prix} GNF</div>
                              </div>
                          </div>
                      `;
                  });
              } else {
                  feedContainer.innerHTML = '<p style="text-align:center; color: var(--text-secondary); padding: 30px;">Aucune annonce pour le moment. Soyez le premier à publier !</p>';
              }
          });
      };

      window.publierAnnonceFirestore = async function(annonceData) {
          try {
              await addDoc(collection(db, "annonces"), {
                  ...annonceData,
                  date: Date.now()
              });
              alert("Annonce publiée et synchronisée en temps réel pour tous les utilisateurs !");
          } catch (error) {
              alert("Erreur lors de la publication : " + error.message);
          }
      };
    </script>

    <style>
        :root {
            --primary: #007AFF;
            --primary-rgb: 0, 122, 255;
            --accent: #FF9500;
            --bg-glass: rgba(255, 255, 255, 0.45);
            --bg-glass-card: rgba(255, 255, 255, 0.65);
            --border-glass: rgba(255, 255, 255, 0.8);
            --text-main: #1c1c1e;
            --text-secondary: #8e8e93;
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
        }

        body.dark-mode {
            --primary: #0A84FF;
            --primary-rgb: 10, 132, 255;
            --accent: #FF9F0A;
            --bg-glass: rgba(28, 28, 30, 0.45);
            --bg-glass-card: rgba(44, 44, 46, 0.65);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #f2f2f7;
            --text-secondary: #aeaeb2;
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f0f2f5;
            color: var(--text-main);
            padding-bottom: 90px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 122, 255, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 149, 0, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            transition: background 0.4s ease, color 0.4s ease;
        }

        header {
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-glass);
        }

        header h1 {
            font-size: 19px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 480px;
            background: var(--bg-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
            border-radius: 25px;
            box-shadow: var(--shadow-glass);
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            background: none;
            border: none;
            flex: 1;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
            transform: translateY(-2px);
        }

        .nav-item span {
            display: block;
            font-size: 18px;
            margin-bottom: 2px;
        }

        .container {
            padding: 20px;
            max-width: 550px;
            margin: 0 auto;
        }

        .tab-content { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .tab-content.active { display: block; opacity: 1; }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        h2 { font-size: 20px; font-weight: 700; }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(var(--primary-rgb), 0.35);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-glass-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            padding: 14px 10px;
            border-radius: 16px;
            text-align: center;
            box-shadow: var(--shadow-glass);
        }
        .stat-card h4 { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; }
        .stat-card span { font-size: 16px; font-weight: 700; color: var(--primary); }

        .feed-card {
            background: var(--bg-glass-card);
            backdrop-filter: blur(25px);
            border-radius: 22px;
            margin-bottom: 20px;
            padding: 18px;
            box-shadow: var(--shadow-glass);
            border: 1px solid var(--border-glass);
        }

        .feed-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .feed-user-info h4 { font-size: 15px; font-weight: 600; }
        .feed-user-info span { font-size: 12px; color: var(--text-secondary); }

        .feed-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .feed-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
        .feed-price { font-size: 16px; color: var(--primary); font-weight: 700; }

        .profile-box {
            background: var(--bg-glass-card);
            backdrop-filter: blur(25px);
            padding: 25px 20px;
            border-radius: 22px;
            text-align: center;
            box-shadow: var(--shadow-glass);
            margin-bottom: 20px;
            border: 1px solid var(--border-glass);
        }

        .profile-avatar-large {
            width: 90px;
            height: 90px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
            margin: 0 auto 12px auto;
            object-fit: cover;
        }

        .settings-section {
            background: var(--bg-glass-card);
            backdrop-filter: blur(25px);
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid var(--border-glass);
        }
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            font-size: 14px;
            border-bottom: 1px solid var(--border-glass);
        }

        .switch {
            position: relative; display: inline-block; width: 50px; height: 28px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e5e5ea; transition: .3s; border-radius: 28px;
        }
        .slider:before {
            position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #34C759; }
        input:checked + .slider:before { transform: translateX(22px); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            justify-content: center;
            align-items: flex-end;
            z-index: 2000;
        }
        .modal-content {
            background: var(--bg-glass-card);
            backdrop-filter: blur(35px);
            color: var(--text-main);
            width: 100%; max-width: 520px;
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 24px; max-height: 92vh; overflow-y: auto;
            border-top: 1px solid var(--border-glass);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.2); color: var(--text-main); border-radius: 12px; font-size: 14px; outline: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Marché Guinée</h1>
        <div class="header-actions">
            <button class="btn-main" onclick="openModal('pubModal')" style="padding: 6px 12px; font-size: 12px;">+ Publier</button>
            <button class="btn-main" onclick="openModal('authModal')" style="padding: 6px 12px; font-size: 12px; background: var(--accent);">Compte</button>
        </div>
    </header>

    <div class="container">
        <!-- Fil d'actualité -->
        <div id="tab-feed" class="tab-content active">
            <div class="section-title">
                <h2>Fil d'actualité</h2>
            </div>
            <div id="feedContainer">
                <p style="text-align:center; color: var(--text-secondary); padding: 30px;">Chargement des annonces...</p>
            </div>
        </div>

        <!-- Espace Vente / Dashboard -->
        <div id="tab-sell" class="tab-content">
            <div class="section-title">
                <h2>Dashboard Vendeur</h2>
            </div>
            <div class="dashboard-grid">
                <div class="stat-card">
                    <h4>Annonces</h4>
                    <span id="statActive">0</span>
                </div>
                <div class="stat-card">
                    <h4>Vendus</h4>
                    <span id="statSold">0</span>
                </div>
                <div class="stat-card">
                    <h4>Chiffre d'Aff.</h4>
                    <span id="statRevenue" style="font-size: 11px;">0 GNF</span>
                </div>
            </div>
        </div>

        <!-- Profil -->
        <div id="tab-profile" class="tab-content">
            <div class="profile-box" id="profileBoxContent">
                <div class="profile-avatar-large" id="profileAvatarDisplay">M</div>
                <h3 id="profileNameDisplay">Mon Profil</h3>
                <p style="font-size:13px; color:var(--text-secondary); margin-top:5px;" id="profileEmailDisplay">Enregistrez votre profil pour l'associer à l'application</p>
            </div>
            <div class="settings-section">
                <h3>⚙️ Paramètres</h3>
                <div class="settings-item">
                    <span>Mode Sombre (iOS Glace)</span>
                    <label class="switch">
                        <input type="checkbox" onchange="document.body.classList.toggle('dark-mode')">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation du bas -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('feed', this)">
            <span>🏠</span>Accueil
        </button>
        <button class="nav-item" onclick="switchTab('sell', this)">
            <span>📊</span>Vendre
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <span>👤</span>Profil
        </button>
    </nav>

    <!-- Modale de publication -->
    <div id="pubModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Publier une annonce</h3>
                <button onclick="closeModal('pubModal')" style="background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-main);">✕</button>
            </div>
            <div class="form-group">
                <label>Votre Nom (Vendeur)</label>
                <input type="text" id="inputVendeur" placeholder="Ex: Ibrahima">
            </div>
            <div class="form-group">
                <label>Lien de votre photo de profil (Optionnel)</label>
                <input type="text" id="inputAvatar" placeholder="Ex: https://... (URL de votre photo)">
            </div>
            <div class="form-group">
                <label>Ville / Localisation</label>
                <input type="text" id="inputLocation" placeholder="Ex: Conakry, Madina">
            </div>
            <div class="form-group">
                <label>Titre de l'article</label>
                <input type="text" id="inputTitre" placeholder="Ex: iPhone 13 Pro">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="inputDesc" placeholder="Détails de l'article..."></textarea>
            </div>
            <div class="form-group">
                <label>Prix (GNF)</label>
                <input type="text" id="inputPrix" placeholder="Ex: 5000000">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-main" onclick="validerPublication()" style="flex: 1;">Publier</button>
                <button class="btn-main" onclick="closeModal('pubModal')" style="flex: 1; background: #8e8e93;">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Modale Inscription / Compte -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Créer un compte / Profil</h3>
                <button onclick="closeModal('authModal')" style="background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-main);">✕</button>
            </div>
            <div class="form-group">
                <label>Nom complet</label>
                <input type="text" id="authName" placeholder="Ex: Ibrahima Barry">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="authEmail" placeholder="Ex: ibrahima@gmail.com">
            </div>
            <div class="form-group">
                <label>Lien de votre Photo de Profil (URL)</label>
                <input type="text" id="authPhoto" placeholder="Ex: https://image.com/mon-visage.jpg">
            </div>
            <div class="form-group">
                <label>Ville</label>
                <input type="text" id="authLocation" placeholder="Ex: Conakry">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-main" onclick="validerInscription()" style="flex: 1;">Enregistrer mon profil</button>
                <button class="btn-main" onclick="closeModal('authModal')" style="flex: 1; background: #8e8e93;">Fermer</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            if(element) element.classList.add('active');
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function validerPublication() {
            const vendeur = document.getElementById('inputVendeur').value.trim();
            const avatar = document.getElementById('inputAvatar').value.trim();
            const location = document.getElementById('inputLocation').value.trim() || 'Guinée';
            const titre = document.getElementById('inputTitre').value.trim();
            const desc = document.getElementById('inputDesc').value.trim();
            const prix = document.getElementById('inputPrix').value.trim();

            if(!vendeur || !titre || !prix) {
                alert("Veuillez remplir au moins votre nom, le titre et le prix !");
                return;
            }

            window.publierAnnonceFirestore({ vendeur, avatar, location, titre, description: desc, prix });
            closeModal('pubModal');

            document.getElementById('inputTitre').value = '';
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputPrix').value = '';
        }

        function validerInscription() {
            const name = document.getElementById('authName').value.trim();
            const email = document.getElementById('authEmail').value.trim();
            const photo = document.getElementById('authPhoto').value.trim();
            const location = document.getElementById('authLocation').value.trim() || 'Guinée';

            if(!name || !email) {
                alert("Veuillez remplir votre nom et votre email !");
                return;
            }

            document.getElementById('profileNameDisplay').innerText = name;
            document.getElementById('profileEmailDisplay').innerText = email + " (" + location + ")";
            
            if(photo) {
                document.getElementById('profileAvatarDisplay').outerHTML = `<img src="${photo}" class="profile-avatar-large" id="profileAvatarDisplay">`;
            } else {
                document.getElementById('profileAvatarDisplay').innerText = name.charAt(0).toUpperCase();
            }

            alert("Profil enregistré avec succès !");
            closeModal('authModal');
        }
    </script>
</body>
</html>
