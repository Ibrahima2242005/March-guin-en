<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkUp - Marché Guinéen</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #1b4d3e;
            --primary-light: #2c6b56;
            --background: #f8f9fa;
            --surface: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Cartes et Formulaires */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-light);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background-color: rgba(27, 77, 62, 0.05);
        }

        /* Fil d'actualité / Produits */
        .post-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 16px;
            overflow: hidden;
        }

        .post-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--text-muted);
            margin-right: 12px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-user-info .name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .post-user-info .time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .post-image {
            width: 100%;
            max-height: 350px;
            object-type: cover;
            background-color: #000;
        }

        .post-content {
            padding: 16px;
        }

        .post-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .post-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .post-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* Navigation Basse */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        nav button {
            background: none;
            color: var(--text-muted);
            border: none;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            width: auto;
        }

        nav button.active {
            color: var(--primary);
            font-weight: 600;
        }

        /* Conditions d'utilisation */
        .terms-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .terms-container input {
            width: auto;
            margin-bottom: 0;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">LinkUp</h1>
        <div id="header-user"></div>
    </header>

    <div class="container">
        <!-- VUE ACCUEIL / FIL D'ACTUALITÉ -->
        <div id="view-accueil" class="view active">
            <div id="feed-container">
                <!-- Les publications s'afficheront dynamiquement ici -->
            </div>
        </div>

        <!-- VUE PUBLIER / VENDRE -->
        <div id="view-vendre" class="view">
            <div class="card">
                <h2 style="font-size: 1.1rem; margin-bottom: 16px; font-weight: 600;">Nouvelle publication</h2>
                <form id="post-form">
                    <input type="text" id="product-title" placeholder="Titre du produit ou service" required>
                    <input type="text" id="product-price" placeholder="Prix (ex: 150 000 GNF)" required>
                    <textarea id="product-desc" rows="4" placeholder="Description détaillée..." required></textarea>
                    <input type="file" id="product-image" accept="image/*" required>
                    <button type="submit">Publier sur le fil</button>
                </form>
            </div>
        </div>

        <!-- VUE PROFIL & PARAMÈTRES -->
        <div id="view-profil" class="view">
            <div id="auth-container" class="card">
                <!-- Formulaire Connexion / Inscription géré dynamiquement -->
            </div>
            <div id="profile-settings" class="card" style="display: none;">
                <h2 style="font-size: 1.1rem; margin-bottom: 16px; font-weight: 600;">Paramètres du profil</h2>
                <form id="profile-form">
                    <label style="font-size: 0.85rem; color: var(--text-muted);">Nom complet</label>
                    <input type="text" id="profile-name" required>
                    <label style="font-size: 0.85rem; color: var(--text-muted);">Numéro de téléphone</label>
                    <input type="text" id="profile-phone" placeholder="Ex: +224..." required>
                    <button type="submit">Mettre à jour</button>
                </form>
                <button class="btn-secondary" id="logout-btn" style="margin-top: 16px;">Se déconnecter</button>
            </div>
        </div>
    </div>

    <!-- NAVIGATION -->
    <nav>
        <button onclick="switchView('accueil')" id="nav-accueil" class="active">Accueil</button>
        <button onclick="switchView('vendre')" id="nav-vendre">Publier</button>
        <button onclick="switchView('profil')" id="nav-profil">Profil</button>
    </nav>

    <script>
        // CONFIGURATION FIREBASE (À remplacer par vos propres identifiants Firebase)
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "VOTRE_AUTH_DOMAIN",
            projectId: "VOTRE_PROJECT_ID",
            storageBucket: "VOTRE_STORAGE_BUCKET",
            messagingSenderId: "VOTRE_MESSAGING_SENDER_ID",
            appId: "VOTRE_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Gestion de la navigation
        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`view-${viewName}`).classList.add('active');
            document.getElementById(`nav-${viewName}`).classList.add('active');
            window.scrollTo(0, 0);
        }

        // Gestion de l'authentification et affichage dynamique
        auth.onAuthStateChanged(async (user) => {
            const authContainer = document.getElementById('auth-container');
            const profileSettings = document.getElementById('profile-settings');
            
            if (user) {
                authContainer.style.display = 'none';
                profileSettings.style.display = 'block';

                // Charger les infos du profil Firestore
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists) {
                    const data = userDoc.data();
                    document.getElementById('profile-name').value = data.name || '';
                    document.getElementById('profile-phone').value = data.phone || '';
                }
            } else {
                authContainer.style.display = 'block';
                profileSettings.style.display = 'none';
                renderAuthForm();
            }
            loadFeed();
        });

        // Formulaire d'authentification avec acceptation des conditions
        function renderAuthForm() {
            const container = document.getElementById('auth-container');
            container.innerHTML = `
                <h2 style="font-size: 1.1rem; margin-bottom: 16px; font-weight: 600;">Connexion / Inscription</h2>
                <form id="auth-submit-form">
                    <input type="email" id="auth-email" placeholder="Adresse email" required>
                    <input type="password" id="auth-password" placeholder="Mot de passe" required>
                    <div class="terms-container">
                        <input type="checkbox" id="terms-check" required>
                        <label for="terms-check">J'accepte les conditions d'utilisation et la politique de confidentialité de l'application.</label>
                    </div>
                    <button type="submit">Continuer</button>
                </form>
            `;

            document.getElementById('auth-submit-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('auth-email').value;
                const password = document.getElementById('auth-password').value;
                const acceptedTerms = document.getElementById('terms-check').checked;

                if (!acceptedTerms) {
                    alert("Vous devez accepter les conditions d'utilisation.");
                    return;
                }

                try {
                    // Tentative de connexion, sinon inscription
                    let res;
                    try {
                        res = await auth.signInWithEmailAndPassword(email, password);
                    } catch (err) {
                        res = await auth.createUserWithEmailAndPassword(email, password);
                        // Initialiser le profil utilisateur
                        await db.collection('users').doc(res.user.uid).set({
                            name: email.split('@')[0],
                            phone: '',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    alert("Connexion réussie");
                } catch (error) {
                    alert("Erreur : " + error.message);
                }
            });
        }

        // Mise à jour du profil (Nom et Numéro)
        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const name = document.getElementById('profile-name').value;
            const phone = document.getElementById('profile-phone').value;

            try {
                await db.collection('users').doc(user.uid).set({
                    name: name,
                    phone: phone
                }, { merge: true });
                alert("Profil mis à jour avec succès");
            } catch (error) {
                alert("Erreur lors de la mise à jour : " + error.message);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut();
        });

        // Publication d'un produit (Upload Cloudinary ou stockage direct)
        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) {
                alert("Veuillez vous connecter pour publier.");
                switchView('profil');
                return;
            }

            const title = document.getElementById('product-title').value;
            const price = document.getElementById('product-price').value;
            const desc = document.getElementById('product-desc').value;
            const imageFile = document.getElementById('product-image').files[0];

            // Récupérer le nom et le téléphone de l'utilisateur
            const userDoc = await db.collection('users').doc(user.uid).get();
            const userData = userDoc.exists ? userDoc.data() : { name: "Utilisateur" };

            // Simulation d'upload d'image (À connecter à Cloudinary si besoin)
            const reader = new FileReader();
            reader.readAsDataURL(imageFile);
            reader.onload = async () => {
                const base64Image = reader.result;

                try {
                    await db.collection('posts').add({
                        userId: user.uid,
                        userName: userData.name || "Utilisateur",
                        userPhone: userData.phone || "Non renseigné",
                        title: title,
                        price: price,
                        description: desc,
                        imageUrl: base64Image,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert("Publication réussie !");
                    document.getElementById('post-form').reset();
                    switchView('accueil');
                } catch (error) {
                    alert("Erreur lors de la publication : " + error.message);
                }
            };
        });

        // Charger le fil d'actualité
        async function loadFeed() {
            const feedContainer = document.getElementById('feed-container');
            feedContainer.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Chargement du fil...</p>";

            try {
                const snapshot = await db.collection('posts').orderBy('createdAt', 'desc').get();
                feedContainer.innerHTML = "";

                if (snapshot.empty) {
                    feedContainer.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Aucune publication pour le moment.</p>";
                    return;
                }

                snapshot.forEach(doc => {
                    const post = doc.data();
                    const initial = post.userName ? post.userName.charAt(0).toUpperCase() : "U";

                    const postElement = document.createElement('div');
                    postElement.className = 'post-card';
                    postElement.innerHTML = `
                        <div class="post-header">
                            <div class="avatar">${initial}</div>
                            <div class="post-user-info">
                                <div class="name">${post.userName}</div>
                                <div class="time">Contact : ${post.userPhone}</div>
                            </div>
                        </div>
                        <img src="${post.imageUrl}" class="post-image" alt="Produit">
                        <div class="post-content">
                            <div class="post-title">${post.title}</div>
                            <div class="post-price">${post.price}</div>
                            <div class="post-desc">${post.description}</div>
                        </div>
                    `;
                    feedContainer.appendChild(postElement);
                });
            } catch (error) {
                feedContainer.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Erreur de chargement du fil d'actualité.</p>";
            }
        }
    </script>
</body>
</html>
